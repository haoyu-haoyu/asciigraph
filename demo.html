<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>asciigraph · try it</title>
  <meta name="description" content="Drop in a photo: water, skies, grass, waterfalls, steam, fire and starlight come to life as a seamless loop and an ASCII animation, all in your browser.">
  <style>
    :root { --bg: #0c0e0b; --panel: #151912; --line: #2a3123; --text: #dfe8d2; --dim: #8d9a80; --accent: #b9e07a; --warn: #f0b26a; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "PingFang SC", sans-serif; }
    main { display: grid; grid-template-columns: 300px 1fr; min-height: 100vh; }
    aside { padding: 20px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px; background: var(--panel); }
    h1 { margin: 0; font: 600 18px/1.2 Menlo, monospace; color: var(--accent); }
    h1 small { display: block; margin-top: 6px; font: 13px/1.4 system-ui, sans-serif; color: var(--dim); }
    label { display: grid; gap: 4px; font-size: 12px; color: var(--dim); }
    select, button { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; }
    button { cursor: pointer; }
    button:hover:not(:disabled), select:hover { border-color: var(--accent); }
    button:disabled { opacity: .5; cursor: default; }
    .primary { background: var(--accent); color: #11170a; border-color: var(--accent); font-weight: 600; }
    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }
    .seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
    .seg button { flex: 1; border: 0; border-radius: 0; background: transparent; }
    .seg button[aria-pressed="true"] { background: var(--line); color: var(--accent); }
    #drop { border: 1.5px dashed var(--line); border-radius: 8px; padding: 16px; text-align: center; color: var(--dim); cursor: pointer; }
    #drop.over { border-color: var(--accent); color: var(--accent); }
    .samples { display: flex; gap: 6px; flex-wrap: wrap; }
    .samples button { font-size: 12px; padding: 4px 8px; }
    #stage { position: relative; display: grid; place-items: center; padding: 20px; min-height: 60vh; }
    #stage canvas { max-width: 100%; max-height: calc(100vh - 40px); display: block; }
    #msg { position: absolute; inset: auto 20px 20px 20px; text-align: center; color: var(--warn); }
    #msg code { color: var(--text); }
    #progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; display: none; }
    #progress div { height: 100%; width: 0; background: var(--accent); }
    #status { font-size: 12px; color: var(--dim); min-height: 18px; }
    #status a { color: var(--accent); }
    footer { margin-top: auto; font-size: 12px; color: var(--dim); }
    footer a { color: var(--dim); }
    @media (max-width: 760px) {
      main { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); padding: 16px; }
      #stage { padding: 16px; min-height: 50vh; }
    }
  </style>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "mp4-muxer": "https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/build/mp4-muxer.mjs"
    } }
  </script>
</head>
<body>
  <main>
    <aside>
      <h1>asciigraph<small data-t="tagline">Drop in a photo and it comes to life as a seamless loop. Nothing leaves your browser.</small></h1>
      <div id="drop" tabindex="0" role="button" data-t="drop">Drop a photo here, or click to choose one</div>
      <input id="file" type="file" accept="image/*" hidden>
      <div class="samples"><span data-t="or" style="font-size:12px;color:var(--dim);align-self:center">Or try:</span></div>
      <label><span data-t="scene">Scene</span>
        <select id="scene">
          <option value="" data-t="auto">Guess from the photo</option>
          <option value="water" data-t="water">Water, sea, river</option>
          <option value="sky" data-t="sky">Sky and clouds</option>
          <option value="grass" data-t="grass">Grass, fields</option>
          <option value="waterfall" data-t="waterfall">Waterfall</option>
          <option value="steam" data-t="steam">Steam, smoke, mist</option>
          <option value="fire" data-t="fire">Fire, candles</option>
          <option value="twinkle" data-t="twinkle">Stars, lights at night</option>
        </select>
      </label>
      <label><span data-t="size">Size</span>
        <select id="size">
          <option value="" data-t="photo">The photo's own shape</option>
          <option value="iphone">iPhone</option>
          <option value="iphone-max">iPhone Pro Max / Plus</option>
          <option value="android">Android</option>
          <option value="ipad">iPad</option>
          <option value="mac">Mac</option>
          <option value="1080p">1080p</option>
          <option value="1440p">1440p</option>
          <option value="4k">4K</option>
        </select>
      </label>
      <div class="seg" role="group">
        <button id="m-ascii" aria-pressed="true">ASCII</button>
        <button id="m-flow" aria-pressed="false" data-t="flowview">Photo</button>
      </div>
      <div class="row">
        <button id="sound" aria-pressed="false" data-t="soundoff">Sound: off</button>
      </div>
      <button id="export" class="primary" disabled data-t="export">Download MP4</button>
      <div id="progress"><div></div></div>
      <div id="status"></div>
      <footer data-t="footer">Loops are 12 seconds and repeat with no visible seam. The download follows the size you picked; a 4K loop takes a few minutes.</footer>
    </aside>
    <section id="stage">
      <div id="msg"></div>
    </section>
  </main>
  <script type="module" src="./src/demo.js"></script>
</body>
</html>
