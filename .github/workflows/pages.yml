# Publishes the drop-a-photo page (demo.html) and <living-photo>'s example to
# GitHub Pages. It needs Pages turned on (Settings → Pages → Source: GitHub
# Actions); on a free plan the repo must be public for that.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Site
        run: |
          mkdir _site
          cp -r src examples _site/
          cp demo.html _site/index.html
          cp embed.html _site/embed.html
      - uses: actions/upload-pages-artifact@v3
      - id: deploy
        uses: actions/deploy-pages@v4
